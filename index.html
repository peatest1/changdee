<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชั่งดี - แอปตรวจสอบน้ำหนัก</title>
    <style>
        /* ดึงฟอนต์ภาษาไทย Kanit จาก Google Fonts มาใช้ให้ดูทันสมัย */
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
        
        body {
            background-color: #fabc45; /* สีเหลืองที่ถอดมาจากพื้นหลังรูป */
            color: #2b3a42; /* สีน้ำเงินเข้มจากเส้นและตัวหนังสือ */
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            background-color: #ffffff;
            border: 4px solid #2b3a42;
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 12px 0 rgba(43, 58, 66, 0.15); /* เงาให้ดูมีมิติเหมือนการ์ตูน */
        }
        .logo-img {
            max-width: 120px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 3px solid #2b3a42;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 32px;
            font-weight: 600;
        }
        p.subtitle {
            margin-top: 0;
            margin-bottom: 25px;
            color: #555;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 3px solid #2b3a42;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Kanit', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #fabc45;
        }
        button {
            background-color: #2b3a42;
            color: #fabc45;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            margin-top: 15px;
            transition: transform 0.1s;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
            font-size: 18px;
            border: 3px solid #2b3a42;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- เรียกใช้งานไฟล์รูปที่คุณให้มา -->
    <img src="S__59785229_0.jpg" alt="ชั่งดี โลโก้" class="logo-img">
    
    <h1>ชั่งดี</h1>
    <p class="subtitle">แอปคำนวณและประเมินน้ำหนักของคุณ</p>

    <div class="input-group">
        <label for="weight">น้ำหนัก (กิโลกรัม)</label>
        <input type="number" id="weight" placeholder="เช่น 65" required>
    </div>

    <div class="input-group">
        <label for="height">ส่วนสูง (เซนติเมตร)</label>
        <input type="number" id="height" placeholder="เช่น 170" required>
    </div>

    <button onclick="calculateBMI()">คำนวณเลย!</button>

    <div id="result"></div>
</div>

<script>
    function calculateBMI() {
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value) / 100; // แปลงส่วนสูงเป็นเมตร
        const resultDiv = document.getElementById('result');

        // ตรวจสอบว่ากรอกข้อมูลครบและถูกต้องหรือไม่
        if (!weight || !height || weight <= 0 || height <= 0) {
            resultDiv.style.display = 'block';
            resultDiv.style.backgroundColor = '#ffdddd';
            resultDiv.style.color = '#e74c3c';
            resultDiv.innerHTML = 'กรุณากรอกตัวเลขน้ำหนักและส่วนสูงให้ถูกต้องครับ';
            return;
        }

        // คำนวณ BMI
        const bmi = (weight / (height * height)).toFixed(2);
        let status = '';
        let bgColor = '';
        let textColor = '#2b3a42';

        // เทียบเกณฑ์ BMI
        if (bmi < 18.5) {
            status = 'น้ำหนักน้อย / ผอม';
            bgColor = '#a8e6cf';
        } else if (bmi >= 18.5 && bmi <= 22.90) {
            status = 'น้ำหนักปกติ (สุขภาพดี)';
            bgColor = '#dcedc1';
        } else if (bmi >= 23 && bmi <= 24.90) {
            status = 'ท้วม / น้ำหนักเกิน';
            bgColor = '#ffd3b6';
        } else if (bmi >= 25 && bmi <= 29.90) {
            status = 'อ้วนระดับ 1';
            bgColor = '#ffaaa5';
        } else {
            status = 'อ้วนระดับ 2 (อันตราย)';
            bgColor = '#ff8b94';
        }

        // แสดงผลลัพธ์
        resultDiv.style.display = 'block';
        resultDiv.style.backgroundColor = bgColor;
        resultDiv.style.color = textColor;
        resultDiv.innerHTML = `ค่า BMI: <strong>${bmi}</strong><br>อยู่ในเกณฑ์: <strong>${status}</strong>`;
    }
</script>

</body>
</html>
